name: Retrieve approved tour photograph originals
on:
  push:
    branches: ['work/approved-tour-gallery-2026-10-14']
    paths: ['.github/workflows/acquire-approved-tour-images.yml']
permissions:
  contents: read
jobs:
  photographs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install image verification library
        run: python -m pip install Pillow==11.3.0
      - name: Download only the explicitly approved photographs
        run: |
          mkdir -p approved-originals
          cat > acquire.py <<'PY'
          import hashlib, json, time, urllib.request, urllib.error
          from pathlib import Path
          from PIL import Image, ImageOps
          Image.MAX_IMAGE_PIXELS = 150000000
          rows = [
              ('L01','6/63/Tower_Bridge_from_Shad_Thames.jpg',15287,7643),
              ('L04','a/a6/London_Millennium_Bridge_Tate_Modern_Museum_Saint_Paul%27s_Cathedral_Tamise_River_Night_Explore_Image_Picture_Long_pose_%2816484823825%29.jpg',5616,3744),
              ('L05','1/1a/Tower_of_London_at_night.jpg',4700,3003),
              ('L06','b/b4/London_Eye_Twilight_April_2006.jpg',2100,1400),
              ('L07','f/ff/Albert_Memorial%2C_London_-_May_2008.jpg',5806,5992),
              ('L08','9/90/Camden_Lock_panorama_at_sunset.jpg',8000,2989),
              ('U01','4/46/Stonehenge%2C_Condado_de_Wiltshire%2C_Inglaterra%2C_2014-08-12%2C_DD_15.JPG',5459,2631),
              ('U02','8/8f/Windsor_Castle_at_Sunset_-_Nov_2006.jpg',3990,2659),
              ('U03','2/2b/Radcliffe_Camera%2C_Oxford_-_Oct_2006.jpg',3077,4524),
              ('U04','6/60/Bridge_of_Sighs%2C_St_John%27s_College%2C_Cambridge%2C_UK_-_Diliff.jpg',5680,3787),
              ('U05','8/88/Puente_Pulteney%2C_Bath%2C_Inglaterra%2C_2014-08-12%2C_DD_51.JPG',5483,3655),
              ('U06','3/37/Building_in_an_old_street._%28Unsplash%29.jpg',4272,2848),
              ('U07','f/f3/Canterbury_Cathedral_Cloisters%2C_Kent%2C_UK_-_Diliff.jpg',6161,4745),
              ('L02-R1','c/cb/Tower_Bridge_Sunrise_%2816361506776%29.jpg',5353,3576),
              ('L09','7/72/Buckingham_Palace_from_gardens%2C_London%2C_UK_-_Diliff.jpg',5064,3250),
              ('L11','f/f8/COVENT_GARDEN_MARKET_BUILDING_7482_pano_12.jpg',5828,3841),
              ('U08','1/16/Dover_White_Cliffs_3.jpg',6030,5240),
              ('U09','2/25/Blenheim_Palace_south_view_2016.jpg',4638,2784)
          ]
          sources = [(i, ['https://upload.wikimedia.org/wikipedia/commons/'+path], (w,h)) for i,path,w,h in rows]
          sources += [
              ('L03', ['https://pixabay.com/photos/download/big-ben-7116305.jpg','https://cdn.pixabay.com/photo/2022/04/06/20/30/big-ben-7116305_1920.jpg'], (4137,2758)),
              ('L10', ['https://unsplash.com/photos/jsotO6-hBsM/download?force=true','https://images.unsplash.com/photo-1692303074427-44a602934beb'], None)
          ]
          out=Path('approved-originals'); results=[]
          for ident, urls, expected in sources:
              record={'id':ident,'expected_dimensions':expected,'attempts':[],'downloaded':False}
              for url in urls:
                  for attempt in range(3):
                      try:
                          request=urllib.request.Request(url,headers={'User-Agent':'LondraTransfersMediaPreparation/1.0 (approved destination photographs; contact: info@londratransfers.co.uk)'})
                          with urllib.request.urlopen(request,timeout=90) as response:
                              content=response.read(100000001)
                              final_url=response.geturl()
                              mime=response.headers.get('Content-Type','')
                          if len(content)>100000000: raise ValueError('Image exceeds 100 MB safety limit')
                          path=out/(ident+'.jpg'); path.write_bytes(content)
                          with Image.open(path) as im:
                              if im.format not in ('JPEG','PNG','WEBP'): raise ValueError('Not an accepted image format')
                              if im.width*im.height>150000000: raise ValueError('Image exceeds pixel safety limit')
                              im.load(); size=ImageOps.exif_transpose(im).size
                          record.update(downloaded=True,url=url,final_url=final_url,mime=mime,bytes=len(content),sha256=hashlib.sha256(content).hexdigest(),dimensions=size,listed_dimensions_match=(tuple(expected)==size if expected else None),full_resolution_confirmed=(tuple(expected)==size if expected else None))
                          print(ident,size,len(content),'bytes',flush=True)
                          break
                      except Exception as error:
                          record['attempts'].append({'url':url,'error':str(error)[:250]})
                          p=out/(ident+'.jpg')
                          if p.exists(): p.unlink()
                          if isinstance(error,urllib.error.HTTPError) and error.code in (429,500,502,503,504) and attempt<2:
                              time.sleep(10*(attempt+1)); continue
                          break
                  if record['downloaded']: break
              results.append(record)
              (out/'download-report.json').write_text(json.dumps(results,indent=2))
              time.sleep(1)
          print(json.dumps({'downloaded':sum(r['downloaded'] for r in results),'expected':20}))
          if not all(r['downloaded'] for r in results): raise SystemExit('One or more approved originals could not be downloaded; see report.')
          PY
          python acquire.py
      - name: Preserve retrieved photographs and honest download report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Londra-Approved-Photographs-Originals
          path: approved-originals/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
