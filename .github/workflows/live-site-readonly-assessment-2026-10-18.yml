name: Londra live-site read-only assessment 2026-10-18
on:
  push:
    branches: [londra-startup-test-runtime-20261014]
    paths: [.github/workflows/live-site-readonly-assessment-2026-10-18.yml]
permissions:
  contents: read
jobs:
  public-site-check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read-only DNS HTTPS and public-page checks
        shell: bash
        run: |
          python - <<'PY'
          import datetime, json, re, socket, ssl, urllib.request, urllib.error, html
          from urllib.parse import urlparse
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          hostname="londratransfers.co.uk"
          paths=["/", "/en", "/en/services", "/en/tour", "/en/contact", "/admin", "/up", "/robots.txt"]
          report={"checked_at_utc":now,"domain":hostname,"checks":[],"policy":"Read-only GET requests only. No login, mutations, POST, credentials or access to private data."}
          try:
              ips=sorted(set(r[4][0] for r in socket.getaddrinfo(hostname,443,type=socket.SOCK_STREAM)))
              report["resolved_ips"]=ips
              print("DNS",ips,flush=True)
          except Exception as e:
              report["dns_error"]=str(e)
              print("DNS_ERROR",type(e).__name__,str(e)[:250],flush=True)
          ctx=ssl.create_default_context()
          class Guard(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  host=urlparse(newurl).hostname or ""
                  if host not in (hostname,"www."+hostname):
                      raise RuntimeError("Redirect to a different host blocked")
                  return super().redirect_request(req,fp,code,msg,headers,newurl)
          opener=urllib.request.build_opener(urllib.request.HTTPSHandler(context=ctx),Guard)
          for path in paths:
              url="https://"+hostname+path
              row={"path":path}
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; LondraSiteReadOnlyCheck/1.0)","Cache-Control":"no-cache","Accept":"text/html,application/xhtml+xml,text/plain,*/*"})
                  try:
                      response=opener.open(req,timeout=18)
                  except urllib.error.HTTPError as e:
                      response=e
                  with response as r:
                      body=r.read(250000)
                      row["status"]=r.status
                      row["final_url"]=r.geturl()
                      row["content_type"]=r.headers.get("Content-Type","")
                      row["body_bytes_read"]=len(body)
                      row["server"]=r.headers.get("Server","")
                      row["location"]=r.headers.get("Location","")
                      text=body.decode("utf-8","replace")
                      m=re.search(r"<title[^>]*>(.*?)</title>",text,re.I|re.S)
                      row["title"]=html.unescape(re.sub(r"\\s+"," ",m.group(1))).strip()[:180] if m else ""
                      row["mentions_maintenance"]=bool(re.search(r"temporarily unavailable|under maintenance|maintenance mode",text,re.I))
                      row["mentions_londra"]=bool(re.search("Londra Transfers",text,re.I))
                      row["mentions_filament"]=bool(re.search("filament|livewire",text,re.I))
                      row["mentions_laravel_error"]=bool(re.search("Illuminate\\\\|Fatal error|Whoops|Server Error",text,re.I))
              except Exception as e:
                  row["error"]=type(e).__name__+": "+str(e)[:200]
              report["checks"].append(row)
              print("PUBLIC_CHECK",json.dumps(row,ensure_ascii=False),flush=True)
          from pathlib import Path
          Path("londra-live-readonly-2026-10-18.json").write_text(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Londra-Live-Site-Read-Only-Assessment-2026-10-18
          path: londra-live-readonly-2026-10-18.json
          retention-days: 14
