name: Read-only Londra public HTTP diagnostics
on:
  push:
    branches: ['work/approved-tour-gallery-2026-10-14']
    paths: ['.github/workflows/live-http-diagnostics-2026-10-14.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Check only public pages and static assets
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, re, urllib.request, urllib.error, urllib.parse
          class LocalRedirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  parsed = urllib.parse.urlparse(newurl)
                  if parsed.scheme != 'https' or parsed.hostname not in ['londratransfers.co.uk', 'www.londratransfers.co.uk']:
                      raise ValueError('Redirect outside approved HTTPS host')
                  return super().redirect_request(req, fp, code, msg, headers, newurl)
          opener = urllib.request.build_opener(LocalRedirects())
          print('UTC:', datetime.datetime.now(datetime.timezone.utc).isoformat())
          for path in ['/', '/en', '/admin/login', '/index.php', '/assets/theme.js', '/assets/recovery.css']:
              url = 'https://londratransfers.co.uk' + path
              result = {'url': url}
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'LondraReadOnlyDiagnostics/1.0', 'Cache-Control': 'no-cache', 'Accept': 'text/html,application/javascript,text/css;q=0.9,*/*;q=0.8'})
                  try:
                      response = opener.open(req, timeout=20)
                  except urllib.error.HTTPError as error:
                      response = error
                  with response:
                      data = response.read(1048577)
                      text = data.decode('utf-8', 'replace')
                      result.update(status=response.code, final_url=response.geturl(), bytes_read=len(data), truncated=len(data)>1048576, blank=not data.strip(), sha256=hashlib.sha256(data).hexdigest(), headers={k:v for k,v in response.headers.items() if k.lower() in ['content-type','content-length','server','x-powered-by','x-litespeed-cache','cache-control','location']})
                      result['has_html'] = bool(re.search(r'<(?:html|body|main)\b', text, re.I))
                      result['has_londra_text'] = 'londra' in text.lower()
                      result['has_server_error_text'] = any(s in text.lower() for s in ['internal server error','fatal error','server error','service unavailable','uncaught'])
                      result['has_challenge_text'] = any(s in text.lower() for s in ['cf-chl','verify you are human','captcha'])
              except Exception as error:
                  result['network_error'] = type(error).__name__ + ': ' + str(error)[:180]
              print(json.dumps(result, ensure_ascii=False))
          PY
