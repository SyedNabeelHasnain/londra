name: Prepare isolated PHP and MySQL verification runtime
on:
  push:
    branches: ['work/approved-tour-gallery-2026-10-14']
    paths: ['.github/workflows/prepare-isolated-test-runtime.yml']
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 97da842dcf8593fe84bdba2d17d73d2fd6f97b70
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.5'
          extensions: ctype,curl,dom,exif,fileinfo,filter,gd,hash,intl,json,mbstring,openssl,pdo,pdo_mysql,session,tokenizer,xml,xmlwriter,zip
          tools: composer:v2
          coverage: none
          ini-values: memory_limit=512M
        env:
          fail-fast: true
      - name: Install exactly the locked test dependencies
        working-directory: londra-private
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: mysql
          DB_DATABASE: londra_portal_test
          CACHE_STORE: array
          SESSION_DRIVER: array
          MAIL_MAILER: array
        run: |
          python3 ../tools/package.py --prepare
          composer validate --strict
          composer install --prefer-dist --no-interaction --no-progress
          php --version
      - name: Export portable PHP and reference test files
        run: |
          mkdir -p runtime/php/bin runtime/php/lib runtime/php/ext runtime/reference
          cp "$(command -v php)" runtime/php/bin/php
          EXTENSION_DIR=$(php -r 'echo ini_get("extension_dir");')
          cp "$EXTENSION_DIR"/*.so runtime/php/ext/
          python3 - <<'PY'
          import subprocess,re,shutil
          from pathlib import Path
          root=Path('runtime/php')
          for binary in [root/'bin/php',*sorted((root/'ext').glob('*.so'))]:
              result=subprocess.run(['ldd',str(binary)],capture_output=True,text=True,check=True)
              for absolute in re.findall(r'(?:=>\s+)?(/[^\s]+)',result.stdout):
                  path=Path(absolute)
                  if path.is_file() and path.name not in ['libc.so.6','ld-linux-x86-64.so.2']:
                      shutil.copy2(path,root/'lib'/path.name)
          PY
          cp -a londra-private/vendor runtime/reference/vendor
          cp -a londra-private/tests runtime/reference/tests
          cp londra-private/phpunit.xml runtime/reference/phpunit.xml
          cp tools/package.py runtime/reference/package.py
          php -i | grep -E 'PHP Version|extension_dir|WebP|ICU version' > runtime/php-build.txt
      - name: Export an isolated MySQL 8.4 engine and its private dependencies
        run: |
          docker pull mysql:8.4
          mkdir -p runtime/mysql
          docker run --rm --user root --entrypoint bash -v "$PWD/runtime/mysql:/export" mysql:8.4 -ec '
            mkdir -p /export/bin /export/lib /export/share
            for executable in mysqld mysql mysqladmin; do cp "$(command -v "$executable")" /export/bin/; done
            for executable in /export/bin/*; do
              ldd "$executable" | awk "{for(i=1;i<=NF;i++) if(\$i ~ /^\//) print \$i}" | while read -r library; do
                case "$(basename "$library")" in libc.so.6|ld-linux-x86-64.so.2) continue;; esac
                cp -L "$library" /export/lib/
              done
            done
            if [ -d /usr/share/mysql-8.4 ]; then cp -a /usr/share/mysql-8.4/. /export/share/; elif [ -d /usr/share/mysql ]; then cp -a /usr/share/mysql/. /export/share/; fi
            if [ -d /usr/lib64/mysql/plugin ]; then mkdir -p /export/lib/plugin; cp -a /usr/lib64/mysql/plugin/. /export/lib/plugin/; fi
            mysqld --version > /export/version.txt
          '
          chmod -R a+rX runtime
      - name: Verify no production environment or records are included
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,zipfile
          root=Path('runtime')
          forbidden=[p for p in root.rglob('*') if p.is_file() and (p.name=='.env' or p.suffix in ('.sql','.sqlite'))]
          if forbidden:raise SystemExit('Unexpected environment or database file')
          files=[p for p in root.rglob('*') if p.is_file()]
          Path('runtime-manifest.json').write_text(json.dumps({'base_commit':'97da842dcf8593fe84bdba2d17d73d2fd6f97b70','purpose':'Isolated local verification only; not a website release','files':len(files),'mysql':'8.4','php':'8.5'},indent=2))
          with zipfile.ZipFile('Londra_Isolated_Test_Runtime.zip','w',zipfile.ZIP_DEFLATED,compresslevel=6) as archive:
              for p in sorted(files):archive.write(p,p.as_posix())
              archive.write('runtime-manifest.json')
          print('runtime bytes',Path('Londra_Isolated_Test_Runtime.zip').stat().st_size)
          PY
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Londra-Isolated-Test-Runtime
          path: Londra_Isolated_Test_Runtime.zip
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
