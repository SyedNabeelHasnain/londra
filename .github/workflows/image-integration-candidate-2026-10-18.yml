name: Londra isolated image-update release candidate (not current latest archive)

on:
  push:
    branches: [londra-startup-test-runtime-20261014]
    paths:
      - .github/workflows/image-integration-candidate-2026-10-18.yml
      - review-tools/stage-original-airport-and-tour-gallery-candidate.py
      - review-tools/candidate-web-smoke.py
      - londra-private/app/Services/FleetPhotoGallery.php
      - londra-private/app/Filament/Pages/FleetPhotoGalleries.php
      - londra-private/app/Http/Controllers/PublicPageController.php
      - londra-private/app/Providers/Filament/AdminPanelProvider.php
      - londra-private/app/Services/MediaReferences.php
      - londra-private/resources/views/atelier/page.php
      - londra-private/resources/views/atelier/fleet-photo-gallery.php
      - londra-private/resources/views/filament/pages/fleet-photo-galleries.blade.php
      - londra-private/resources/js/app.js
      - londra-private/resources/css/site.css
      - londra-private/tests/Unit/FleetPhotoGalleryTest.php
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: londra-private-review-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: londra_portal_test
          MYSQL_ROOT_PASSWORD: isolated-ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=isolated-ci-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: https://londratransfers.co.uk
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: londra_portal_test
      DB_USERNAME: root
      DB_PASSWORD: isolated-ci-password
      CACHE_STORE: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: database
      LONDRA_ACCEPT_INQUIRIES: 'false'
      LONDRA_SEND_NOTIFICATIONS: 'false'
      LONDRA_PUBLICATION_APPROVED: 'false'
      LONDRA_PRIVACY_APPROVED: 'false'
      LONDRA_INDEXING_ENABLED: 'false'
      LONDRA_COUNTRY_LOOKUP: 'false'
      COMPOSER_ALLOW_SUPERUSER: '1'
    defaults:
      run:
        working-directory: londra-private
        shell: bash
    steps:
      - name: Check out the current source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up PHP 8.5 and required extensions
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.5'
          extensions: ctype, curl, dom, exif, fileinfo, filter, gd, hash, intl, json, mbstring, openssl, pdo, pdo_mysql, session, tokenizer, xml, xmlwriter, zip
          tools: composer:v2
          coverage: none
          ini-values: memory_limit=512M
        env:
          fail-fast: true
      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare writable application directories
        run: python3 ../tools/package.py --prepare
      - name: Validate locked PHP dependencies
        run: composer validate --strict
      - name: Install locked development dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Verify image capabilities
        run: php -r 'if (!extension_loaded("exif") || !function_exists("imagewebp") || !gd_info()["WebP Support"]) { fwrite(STDERR, "GD WebP and EXIF support are required.\n"); exit(1); }'
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Stage handpicked airport originals and approved tours from WebP artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install --quiet requests
          python3 ../review-tools/stage-original-airport-and-tour-gallery-candidate.py
      - name: Validate new PHP views
        run: |
          php -l resources/views/atelier/airport-hero.php
          php -l resources/views/atelier/approved-tour-gallery.php
          php -l resources/views/atelier/page.php
          php -l resources/views/atelier/fleet-photo-gallery.php
          php -l app/Services/FleetPhotoGallery.php
          php -l app/Filament/Pages/FleetPhotoGalleries.php
          php -l app/Services/MediaReferences.php
          php -l app/Http/Controllers/PublicPageController.php
          php -l app/Providers/Filament/AdminPanelProvider.php
          php -l tests/Unit/FleetPhotoGalleryTest.php
          node --check resources/js/app.js
      - name: Compile the production website and CMS assets
        run: npm run build
      - name: Publish Filament assets
        run: |
          php artisan filament:assets --no-interaction
          cp resources/fonts/LICENSE ../public_html/fonts/filament/filament/inter/LICENSE.txt
      - name: Verify standalone domain rules
        run: php tests/domain-checks.php
      - name: Run the isolated MySQL regression suite
        run: vendor/bin/phpunit --colors=never --display-errors --display-warnings --display-deprecations --display-notices --fail-on-warning --fail-on-deprecation --fail-on-notice --fail-on-risky --fail-on-skipped --fail-on-incomplete
      - name: Read-only browser smoke test of isolated seeded MySQL application
        run: |
          # This database is the ephemeral MySQL 8.4 CI service, never production.
          php artisan migrate:fresh --seed --force
          cat > /tmp/londra-review-router.php <<'PHP'
          <?php
          $path = parse_url($_SERVER['REQUEST_URI'], PHP_URL_PATH);
          $file = realpath(__DIR__ . '/public_html' . $path);
          $root = realpath(__DIR__ . '/public_html');
          if ($file && str_starts_with($file, $root . DIRECTORY_SEPARATOR) && is_file($file)) {
              return false;
          }
          require __DIR__.'/public_html/index.php';
          PHP
          sed -i "s#__DIR__ . '/public_html'#getenv('GITHUB_WORKSPACE') . '/public_html'#g; s#__DIR__.'/public_html/index.php'#getenv('GITHUB_WORKSPACE').'/public_html/index.php'#g" /tmp/londra-review-router.php
          php -S 127.0.0.1:8765 -t ../public_html /tmp/londra-review-router.php >/tmp/londra-isolated-server.log 2>&1 &
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
          python3 ../review-tools/candidate-web-smoke.py
      - name: Install locked production dependencies
        run: |
          rm -rf -- vendor
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader --no-scripts
      - name: Rebuild production package discovery
        run: |
          python3 ../tools/package.py --prepare
          php artisan package:discover --no-interaction
          php artisan filament:assets --no-interaction
          cp resources/fonts/LICENSE ../public_html/fonts/filament/filament/inter/LICENSE.txt
          composer check-platform-reqs --no-dev
      - name: Create and verify candidate package without production secrets
        run: python3 ../tools/package.py --output ../dist/Londra_Original_Airports_Trial_Candidate.zip
      - name: Upload the verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Londra-Original-Images-Isolated-Candidate
          path: dist/Londra_Original_Airports_Trial_Candidate.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload browser visual QA from isolated source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Londra-Image-Candidate-Responsive-QA
          path: |
            image-review-qa/
            review-candidate-status.json
          if-no-files-found: warn
          compression-level: 5
          retention-days: 14
