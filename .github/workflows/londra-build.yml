name: Londra Transfers — Build and Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'londra-qa21-source.zip'
      - '.github/patches/privacy10.part*.txt'
      - '.github/patches/privacy10-fixture-adminid.patch'
      - '.github/tests/PrivacyAdminTest.php'
      - '.github/patches/qa11-gated-privacy-form.patch'
      - '.github/patches/qa11-gated-privacy-form.zlib.b64'
      - '.github/patches/qa12-dynamic-privacy-links.zlib.b64'
      - '.github/patches/qa13-privacy-rights-corrections.zlib.b64'
      - '.github/patches/qa13-privacy-receipt-test.patch'
      - '.github/patches/qa14-verified-erasure-holds.patch'
      - '.github/scripts/qa15_after_commit.py'
      - '.github/scripts/qa16_admin_schema.py'
      - '.github/scripts/qa18_privacy_schema_gate.py'
      - '.github/scripts/verify_hostinger_release.py'
      - '.github/scripts/qa20_legacy_upgrade.php'
      - '.github/docs/HOSTINGER_NO_SSH_RELEASE.md'
      - '.github/patches/qa15-response-clock-from-receipt.patch'
      - '.github/patches/qa16-documented-holds.patch'
      - '.github/scripts/qa21_ImportPolicyDrafts.php'
      - '.github/scripts/qa21_PolicyDraftSmoke.php'
      - '.github/patches/qa21-policy-admin-action.patch'
      - '.github/scripts/qa22_RecordSchedulerHeartbeat.php'
      - '.github/scripts/qa22_HeartbeatSmoke.php'
      - '.github/patches/qa22-heartbeat-readiness.patch'
      - '.github/patches/qa22-cron-schedule.patch'
      - '.github/patches/qa23-cron.php'
      - '.github/patches/qa24-cron-release.patch'
      - '.github/patches/qa25-operational-compliance.patch'
      - '.github/patches/qa26-zoho-mail-only.patch'

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Compile and verify against temporary MySQL
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: londra_test
          MYSQL_USER: londra_ci
          MYSQL_PASSWORD: ci_ephemeral_database_password
          MYSQL_ROOT_PASSWORD: ci_ephemeral_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      CI: "true"
      COMPOSER_MEMORY_LIMIT: -1
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: londra_test
      DB_USERNAME: londra_ci
      DB_PASSWORD: ci_ephemeral_database_password
    steps:
      - name: Checkout submitted single source ZIP
        uses: actions/checkout@v5

      - name: Verify single source ZIP and extract
        shell: bash
        run: |
          set -euo pipefail
          echo "5bc21cdfe41dfb8cd34fffab92b858c8a0eb21014fb937a0463a32c8a60d5270  londra-qa21-source.zip" | sha256sum -c -
          mkdir -p "$GITHUB_WORKSPACE/londra"
          unzip -q londra-qa21-source.zip -d "$GITHUB_WORKSPACE/londra"
          test -f londra/composer.json
          test -f londra/artisan
          test -f londra/package.json
          test ! -f londra/.env
          (cd londra && sha256sum -c SHA256SUMS.txt)

      - name: Set up PHP 8.5 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, gd, intl, json, mbstring, openssl, pdo, pdo_mysql, session, tokenizer, xml, xmlwriter, zip
          coverage: none

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify PHP platform and source syntax
        working-directory: londra
        shell: bash
        run: |
          set -euo pipefail
          php -v
          php -r 'if (PHP_VERSION_ID < 80504 || PHP_VERSION_ID >= 80600) { exit(1); }'
          php -r 'foreach (["curl","dom","intl","mbstring","pdo_mysql","xmlwriter"] as $e) { if (!extension_loaded($e)) { fwrite(STDERR,"Required extension unavailable: $e\n"); exit(1); } }'
          composer validate --strict
          find app bootstrap config database lang resources routes tests -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l > "$RUNNER_TEMP/php-lint.txt"
          php -l artisan
          php -l cron.php
          php tests/domain-checks.php

      - name: Apply checksummed privacy rights module
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patches/privacy10.part{01,02,03,04}.txt > "$RUNNER_TEMP/privacy10.xz.b64"
          echo "7f0e04196c6352496152c95a95edae55815f194257ce627baccfbe7728dfa170  $RUNNER_TEMP/privacy10.xz.b64" | sha256sum -c -
          python3 - <<'PY'
          import base64,hashlib,json,lzma
          from pathlib import Path
          records=json.loads(lzma.decompress(base64.b64decode(Path(__import__('os').environ['RUNNER_TEMP'],'privacy10.xz.b64').read_text())))
          base=Path('londra').resolve()
          for rec in records:
              dest=(base / rec['file']).resolve()
              if not dest.is_relative_to(base):raise SystemExit('Invalid path in QA10 module')
              if 'new' in rec:
                  if dest.exists():raise SystemExit('Unexpected existing file: '+rec['file'])
                  content=rec['new']
                  dest.parent.mkdir(parents=True,exist_ok=True)
              else:
                  if not dest.exists():raise SystemExit('Missing QA10 baseline: '+rec['file'])
                  content=dest.read_text()
                  if hashlib.sha256(content.encode()).hexdigest()!=rec['before']:
                      raise SystemExit('QA10 baseline changed: '+rec['file'])
                  for start,end,replacement in reversed(rec['ops']):
                      content=content[:start]+replacement+content[end:]
              if hashlib.sha256(content.encode()).hexdigest()!=rec['after']:
                  raise SystemExit('QA10 checksum mismatch: '+rec['file'])
              dest.write_text(content)
              print('Verified',rec['file'])
          PY
          python3 - <<'PY'
          from pathlib import Path
          path = Path('londra/tests/Feature/PrivacyRightsTest.php')
          source = path.read_text()
          original = "        User::create(['name'=>'Test admin','email'=>'admin@example.test','password'=>'secure_password_is_only_a_test']);\n        app(ErasureService::class)->verify($case,1,'Verified control of the known email address via secure correspondence.');"
          replacement = "        $administrator=User::create(['name'=>'Test admin','email'=>'admin@example.test','password'=>'secure_password_is_only_a_test']);\n        app(ErasureService::class)->verify($case,$administrator->id,'Verified control of the known email address via secure correspondence.');"
          if source.count(original) != 1:
              raise SystemExit('Unable to locate isolated test administrator fixture')
          path.write_text(source.replace(original, replacement))
          PY
          cp .github/tests/PrivacyAdminTest.php londra/tests/Feature/PrivacyAdminTest.php
          python3 - <<'PY'
          import base64, hashlib, zlib
          from pathlib import Path
          compressed=Path('.github/patches/qa11-gated-privacy-form.zlib.b64').read_text().strip()
          data=zlib.decompress(base64.b64decode(compressed))
          expected='0037bba9352256d3700bdc53755a89a2f1f1ed96361fc43737496d9669cd879a'
          if hashlib.sha256(data).hexdigest()!=expected:
              raise SystemExit('QA11 patch integrity mismatch')
          Path('/tmp/londra-qa11.patch').write_bytes(data)
          PY
          patch --fuzz=0 --batch -d londra -p1 < /tmp/londra-qa11.patch
          php -l londra/app/Http/Controllers/PrivacyRequestController.php
          php -l londra/tests/Feature/PrivacyRightsTest.php
          python3 - <<'PY'
          import base64, hashlib, zlib
          from pathlib import Path
          compressed=Path('.github/patches/qa12-dynamic-privacy-links.zlib.b64').read_text().strip()
          data=zlib.decompress(base64.b64decode(compressed))
          expected='6c656ad7aa5fd2f4b195d64dc032f8ff1e2e1c0d16c9fab995397d435d6e2ef5'
          if hashlib.sha256(data).hexdigest()!=expected:
              raise SystemExit('QA12 patch integrity mismatch')
          Path('/tmp/londra-qa12.patch').write_bytes(data)
          PY
          patch --fuzz=0 --batch -d londra -p1 < /tmp/londra-qa12.patch
          php -l londra/app/Http/Controllers/PrivacyRequestController.php
          php -l londra/tests/Feature/PrivacyRightsTest.php
          python3 - <<'PY'
          import base64,hashlib,zlib
          from pathlib import Path
          encoded=Path('.github/patches/qa13-privacy-rights-corrections.zlib.b64').read_text().strip()
          data=zlib.decompress(base64.b64decode(encoded))
          if hashlib.sha256(data).hexdigest()!='aaaeeceeb88a0ed2a898066dc58cc4830812de48fad1416ed2e84b92775700c9':
              raise SystemExit('QA13 patch checksum mismatch')
          Path('/tmp/londra-qa13.patch').write_bytes(data)
          PY
          patch --fuzz=0 --batch -d londra -p1 < /tmp/londra-qa13.patch
          patch --fuzz=0 --batch -d londra -p1 < .github/patches/qa13-privacy-receipt-test.patch
          patch --fuzz=0 --batch -d londra -p1 < .github/patches/qa14-verified-erasure-holds.patch
          python3 .github/scripts/qa15_after_commit.py
          python3 .github/scripts/qa16_admin_schema.py
          python3 .github/scripts/qa18_privacy_schema_gate.py
          php -l londra/app/Http/Controllers/PrivacyRequestController.php
          php -l londra/app/Filament/Pages/Readiness.php
          php -l londra/app/Services/ReadinessReport.php
          php -l londra/tests/Feature/PrivacyRightsTest.php
          php -l londra/app/Services/ErasureService.php
          php -l londra/app/Filament/Resources/PrivacyRequestResource.php
          patch --fuzz=0 --batch -d londra -p1 < .github/patches/qa15-response-clock-from-receipt.patch
          php -l londra/app/Models/PrivacyRequest.php
          patch --fuzz=0 --batch -d londra -p1 < .github/patches/qa16-documented-holds.patch
          php -l londra/app/Models/Inquiry.php
          php -l londra/tests/Feature/PrivacyRightsTest.php
          php -l londra/app/Filament/Resources/PrivacyRequestResource.php
          php -l londra/tests/Feature/PrivacyRightsTest.php
          php -l londra/app/Services/ErasureService.php
          php -l londra/app/Http/Controllers/PrivacyRequestController.php
          php -l londra/resources/views/privacy/request.blade.php
          php -l londra/tests/Feature/PrivacyRightsTest.php
          cp .github/scripts/qa21_ImportPolicyDrafts.php londra/app/Console/Commands/ImportPolicyDrafts.php
          cp .github/scripts/qa21_PolicyDraftSmoke.php londra/qa21_policy_smoke.php
          patch --fuzz=0 --batch -d londra -p1 < .github/patches/qa21-policy-admin-action.patch
          php -l londra/app/Console/Commands/ImportPolicyDrafts.php
          php -l londra/app/Filament/Pages/Readiness.php
          php -l londra/qa21_policy_smoke.php
          cp .github/scripts/qa22_RecordSchedulerHeartbeat.php londra/app/Console/Commands/RecordSchedulerHeartbeat.php
          cp .github/scripts/qa22_HeartbeatSmoke.php londra/qa22_heartbeat_smoke.php
          patch --fuzz=0 --batch -d londra -p1 < .github/patches/qa22-heartbeat-readiness.patch
          patch --fuzz=0 --batch -d londra -p1 < .github/patches/qa22-cron-schedule.patch
          php -l londra/app/Console/Commands/RecordSchedulerHeartbeat.php
          php -l londra/app/Services/ReadinessReport.php
          php -l londra/routes/console.php
          php -l londra/qa22_heartbeat_smoke.php
          find londra/app londra/database/migrations londra/routes londra/tests -name '*.php' -type f -print0 | xargs -0 -n1 php -l > "$RUNNER_TEMP/qa10-lint.txt"

      - name: Enforce transactional mail and privacy readiness safeguards
        shell: bash
        run: |
          set -euo pipefail
          patch --fuzz=0 --batch -d londra -p1 < .github/patches/qa25-operational-compliance.patch
          patch --fuzz=0 --batch -d londra -p1 < .github/patches/qa26-zoho-mail-only.patch
          php -l londra/app/Domain/TransactionalMailPolicy.php
          php -l londra/app/Services/InquirySmtpSender.php
          php -l londra/app/Services/PrivacySmtpSender.php
          php -l londra/app/Services/ReadinessReport.php
          php -l londra/config/londra.php
          php -r '
          require "londra/app/Domain/TransactionalMailPolicy.php";
          use App\Domain\TransactionalMailPolicy as Policy;
          $cases = [
              ["smtp.zoho.com", true, true],
              ["smtppro.zoho.eu", true, true],
              ["smtp.zoho.com", false, false],
              ["smtp.zeptomail.eu", true, false],
              ["smtp.zeptomail.eu", false, false],
              ["smtp.zoho.com.attacker.invalid", true, false],
              ["", true, false],
          ];
          foreach ($cases as [$host, $approved, $expected]) {
              if (Policy::allowed($host, $approved) !== $expected) { exit(1); }
          }
          echo "Transactional SMTP policy checks passed.\n";
          '

      - name: Resolve PHP dependencies and audit
        working-directory: londra
        shell: bash
        run: |
          set -euo pipefail
          composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies
          composer check-platform-reqs
          composer audit --locked --no-interaction

      - name: Resolve JavaScript dependencies and build assets
        working-directory: londra
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-fund
          npm audit --audit-level=high
          npm run build
          test -f public/build/manifest.json

      - name: Generate isolated test environment
        working-directory: londra
        shell: bash
        run: |
          set -euo pipefail
          TEST_KEY=$(php -r 'echo "base64:".base64_encode(random_bytes(32));')
          {
            printf 'APP_NAME="Londra Transfers CI"\n'
            printf 'APP_ENV=testing\nAPP_DEBUG=false\nAPP_URL=http://localhost\n'
            printf 'APP_KEY=%s\n' "$TEST_KEY"
            printf 'DB_CONNECTION=mysql\nDB_HOST=127.0.0.1\nDB_PORT=3306\n'
            printf 'DB_DATABASE=londra_test\nDB_USERNAME=londra_ci\nDB_PASSWORD=ci_ephemeral_database_password\n'
            printf 'SESSION_DRIVER=array\nCACHE_STORE=array\nQUEUE_CONNECTION=database\nMAIL_MAILER=array\n'
            printf 'LONDRA_PREVIEW=true\nLONDRA_ACCEPT_INQUIRIES=false\nLONDRA_SEND_NOTIFICATIONS=false\n'
            printf 'LONDRA_PUBLICATION_APPROVED=false\nLONDRA_PRIVACY_APPROVED=false\nLONDRA_INDEXING_ENABLED=false\n'
          } > .env.testing
          cp .env.testing .env
          php artisan about --only=environment

      - name: Run migrations and framework tests against synthetic database
        working-directory: londra
        shell: bash
        run: |
          set -euo pipefail
          php artisan config:clear
          php artisan migrate --env=testing --force --no-interaction
          php artisan test --testsuite=Portal
          php artisan route:list --except-vendor > "$RUNNER_TEMP/londra-routes.txt"
          php artisan route:list --except-vendor | grep -F 'privacy-request'
          php artisan route:list --except-vendor | grep -F 'system-update'
          test -f database/content/legal-review/2026-10-12-reviewed-copy-unapproved.json

      - name: Test additive privacy migration against preserved legacy enquiry
        working-directory: londra
        shell: bash
        run: |
          set -euo pipefail
          php artisan migrate:fresh --env=testing --force --no-interaction --path=database/migrations/2026_10_08_000001_create_portal_tables.php
          php ../.github/scripts/qa20_legacy_upgrade.php prepare
          php artisan migrate --env=testing --force --no-interaction
          php ../.github/scripts/qa20_legacy_upgrade.php verify
          php artisan migrate --env=testing --force --no-interaction
          php ../.github/scripts/qa20_legacy_upgrade.php verify

      - name: Test guarded CMS staging of unpublished multilingual policies
        working-directory: londra
        shell: bash
        run: |
          set -euo pipefail
          php qa21_policy_smoke.php
          php qa22_heartbeat_smoke.php
          php cron.php
          rm -f qa21_policy_smoke.php qa22_heartbeat_smoke.php

      - name: Verify actual Laravel HTTP responses in all three languages
        working-directory: londra
        shell: bash
        run: |
          set -euo pipefail
          php artisan db:seed --env=testing --force --no-interaction
          LONDRA_PREVIEW=false php artisan serve --host=127.0.0.1 --port=8137 > "$RUNNER_TEMP/londra-web.log" 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" 2>/dev/null || true' EXIT
          python3 ../.github/scripts/public_http_smoke.py

      - name: Compile Filament assets
        working-directory: londra
        shell: bash
        run: |
          set -euo pipefail
          php artisan filament:assets
          test -f public/build/manifest.json
          test -f vendor/autoload.php

      - name: Create no-build private/public hosting archive
        working-directory: londra
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/build-private-release.sh
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          composer check-platform-reqs --no-dev
          mkdir -p "$GITHUB_WORKSPACE/output"
          bash tools/build-private-release.sh "$GITHUB_WORKSPACE/output"
          test -f "$GITHUB_WORKSPACE/output/Londra_Hostinger_Private_Public_Release.zip"
          unzip -tq "$GITHUB_WORKSPACE/output/Londra_Hostinger_Private_Public_Release.zip"
          unzip -Z -1 "$GITHUB_WORKSPACE/output/Londra_Hostinger_Private_Public_Release.zip" | grep -Fx 'londra-private/cron.php'
          cat > "$GITHUB_WORKSPACE/output/READ_BEFORE_HOSTINGER_UPLOAD.txt" <<'ENDNOTE'
          This is a dependency-complete build candidate, NOT a validated one-click Hostinger installation.
          Install using separated private and public directories. Never upload the private Laravel folder into a public URL.
          The first-install browser wizard, Hostinger runtime validation, live database and SMTP tests,
          confirmed policies and administrator creation remain pending.
          Do not deploy publicly based only on a green GitHub Actions run.
          ENDNOTE
          cp composer.lock package-lock.json "$GITHUB_WORKSPACE/output/"
          (cd "$GITHUB_WORKSPACE/output" && sha256sum Londra_Hostinger_Private_Public_Release.zip composer.lock package-lock.json > BUILD_SHA256.txt)

      - name: Include no-SSH update and activation guide
        shell: bash
        run: |
          set -euo pipefail
          cp .github/docs/HOSTINGER_NO_SSH_RELEASE.md output/HOSTINGER_UPDATE_GUIDE.md

      - name: Audit Hostinger ZIP isolation and integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_hostinger_release.py

      - name: Upload verified build candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Londra-Prebuilt-Private-Public-Candidate
          path: output/
          if-no-files-found: error
          retention-days: 14

      - name: Report whether installation is complete
        if: always()
        shell: bash
        run: |
          echo 'GitHub Actions tests package resolution, compilation, source checks, isolated MySQL, and archive integrity.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A passing workflow verifies the synthetic MySQL runtime and compiled assets, not Hostinger deployment, live Zoho SMTP or legally approved business policies.' >> "$GITHUB_STEP_SUMMARY"
